<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สต๊อกชั้น 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
:root{
  color-scheme: light;
  --bg:#FFF5EC; --surface:#FFFFFF; --surface-2:#FFF9F4; --surface-3:#FFE9D8;
  --line:#FADFC8; --line-strong:#F0C39C;
  --ink:#3E2214; --ink-2:#7A4A2D; --muted:#B08561;
  --stock:#F2760C; --log:#E2557B; --move:#7C5CF0; --other:#BCA08C;
  --cellrgb:242,118,12;
  --shadow:0 2px 4px rgba(90,45,15,.06), 0 16px 30px -20px rgba(90,45,15,.45);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#19110B; --surface:#241811; --surface-2:#2E2017; --surface-3:#3B2A1D;
    --line:#412C1E; --line-strong:#5A3D29;
    --ink:#FBEFE5; --ink-2:#E0C4AC; --muted:#AC8B72;
    --stock:#FF9A4D; --log:#FF7EA0; --move:#A78BFA; --other:#9C8371;
    --cellrgb:255,154,77;
    --shadow:0 2px 4px rgba(0,0,0,.35), 0 16px 30px -20px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Prompt","Noto Sans Thai",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num,td.n,.row .qty b,.chip b{font-family:"Nunito","Prompt",ui-sans-serif,sans-serif;
  font-variant-numeric:tabular-nums;font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stock);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
.top-in{max-width:760px;margin:0 auto;padding:12px 14px 12px}
.titlerow{display:flex;align-items:center;gap:10px;min-height:42px}
.titlerow h1{margin:0;font-family:"Mali","Prompt",cursive;font-size:23px;font-weight:700;
  letter-spacing:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--stock)}
.asof{font-size:13px;color:var(--muted);white-space:nowrap}
.back{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-6px;
  border:0;background:var(--surface-3);color:var(--stock);border-radius:14px;cursor:pointer}
.back:active{transform:scale(.94)}
body[data-view="detail"] .back{display:flex}
body[data-view="detail"] .searchrow,body[data-view="detail"] .tabs{display:none}

.searchrow{position:relative;margin-top:10px}
.searchrow input{width:100%;height:54px;padding:0 46px 0 48px;border:2px solid var(--line);
  border-radius:20px;background:var(--surface-2);color:var(--ink);font-size:17px;font-family:inherit;
  transition:border-color .15s, background .15s}
.searchrow input:focus{outline:none;border-color:var(--stock);background:var(--surface)}
.searchrow input::placeholder{color:var(--muted)}
.searchrow .mag{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--stock)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border:0;background:var(--surface-3);border-radius:50%;color:var(--ink-2);font-size:16px;
  cursor:pointer;display:none}
.searchrow.filled .clear{display:block}

.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:7px;margin-top:10px}
.tabs button{height:46px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:16px;font-size:14.5px;font-weight:500;cursor:pointer;padding:0 4px;
  transition:transform .12s}
.tabs button:active{transform:scale(.96)}
.tabs button[aria-pressed="true"]{color:#fff;font-weight:600;border-color:transparent;
  background:linear-gradient(135deg,var(--stock),#FFB34D);
  box-shadow:0 8px 18px -10px rgba(var(--cellrgb),.9)}

/* ---------- lists ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.count{color:var(--ink-2);font-size:14px;margin:2px 6px 12px}
.daygroup{margin-bottom:18px}
.dayhead{display:flex;align-items:center;gap:9px;margin:0 6px 8px}
.dayhead b{font-family:"Mali","Prompt",cursive;font-size:17px;font-weight:600}
.dayhead .pill{font-size:12.5px;color:var(--ink-2);background:var(--surface-3);
  border-radius:999px;padding:3px 10px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:13px;width:100%;min-height:70px;padding:13px 16px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);
  text-align:left;cursor:pointer;transition:transform .12s}
.row:active{transform:scale(.985);background:var(--surface-2)}
.row .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.row .main{flex:1;min-width:0}
.row .name{display:block;font-family:"Mali","Prompt",cursive;font-size:18px;font-weight:600;
  word-break:break-word;line-height:1.35}
.row .sub{display:block;font-size:13.5px;color:var(--muted);margin-top:1px}
.row .qty{text-align:right;flex:0 0 auto}
.row .qty b{display:block;font-size:22px;line-height:1.2;color:var(--ink)}
.row .qty span{font-size:12px;color:var(--muted)}
.row .chev{color:var(--line-strong);flex:0 0 auto}

.row.more{justify-content:center;text-align:center;background:var(--surface-3);box-shadow:none;border-style:dashed}
.row.more .main{flex:0 1 auto}
.row.more .name{color:var(--stock)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);
  border:2px dashed var(--line-strong);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-family:"Mali","Prompt",cursive;font-size:18px;margin-bottom:6px}

/* ---------- detail ---------- */
.dhead{margin:2px 4px 14px}
.dtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dtitle h2{margin:0;font-family:"Mali","Prompt",cursive;font-size:27px;font-weight:700;color:var(--ink)}
.dtitle .kicker{color:var(--muted);font-size:17px;font-weight:500}
.dtitle .lead{font-size:16px;color:var(--ink-2)}
.dtitle .lead b{font-size:20px;color:var(--stock)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface);font-size:14px;color:var(--ink-2);box-shadow:var(--shadow)}
.chip b{color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
button.chip{cursor:pointer;background:var(--surface-3);color:var(--ink);border-color:transparent}
button.chip:active{transform:scale(.96)}

.tablewrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
th,td{padding:11px 8px;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-3);color:var(--ink-2);font-weight:600;
  font-size:14px;border-bottom:1px solid var(--line);z-index:2}
th.who,td.who{position:sticky;left:0;z-index:3;text-align:left;background:var(--surface);
  min-width:150px;border-right:1px solid var(--line)}
thead th.who{background:var(--surface-3);z-index:4}
td.who .cname{font-family:"Mali","Prompt",cursive;font-size:16.5px;font-weight:600;display:block;line-height:1.35}
td.who .cmodel{font-family:"Mali","Prompt",cursive;font-size:16.5px;font-weight:600;display:block;line-height:1.35}
td.who .cname.sub2{font-family:"Prompt",sans-serif;font-weight:500;color:var(--ink-2);font-size:14.5px}
td.who .csheet{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:12.5px;color:var(--muted)}
td.who .csheet .dot{width:7px;height:7px;border-radius:50%}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr.tap{cursor:pointer}
tbody tr.tap:active td,tbody tr.tap:active td.who{background:var(--surface-2)}
td.n{font-size:15px}
td.n span{display:inline-block;min-width:38px;padding:5px 7px;border-radius:11px;color:var(--ink)}
td.zero{color:var(--line-strong)}
td.sum,th.sum{background:var(--surface-2);color:var(--ink)}
tfoot td{border-top:2px solid var(--line-strong);background:var(--surface-3);color:var(--ink)}
tfoot td.who{background:var(--surface-3);font-family:"Mali","Prompt",cursive;font-size:15px;color:var(--ink-2)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body data-view="list">

<header class="top">
  <div class="top-in">
    <div class="titlerow">
      <button class="back" id="back" aria-label="ย้อนกลับ">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="title">สต๊อกชั้น 4</h1>
      <div class="asof" id="asof"></div>
    </div>

    <div class="searchrow" id="searchrow">
      <svg class="mag" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="พิมพ์รุ่นหรือสี เช่น 91017, ดำ">
      <button class="clear" id="clear" aria-label="ล้างคำค้น">✕</button>
    </div>

    <div class="tabs" id="tabs">
      <button data-kind="today" aria-pressed="true">เช็ควันนี้</button>
      <button data-kind="stock" aria-pressed="false">สต๊อกจริง</button>
      <button data-kind="log" aria-pressed="false">งานเข้า</button>
      <button data-kind="move" aria-pressed="false">เบิก/สั่ง</button>
      <button data-kind="all" aria-pressed="false">ทั้งหมด</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="loading" id="boot">กำลังโหลดข้อมูล…</div>
  <div class="count" id="count" hidden></div>
  <div class="rows" id="rows"></div>
</main>

<script>
function startApp(){
  var DATA = window.STOCK_DATA;
  var items = DATA.items;
  var sizeOrder = DATA.sizeOrder;
  var KIND_COLOR = {stock:'var(--stock)', log:'var(--log)', move:'var(--move)', ref:'var(--other)', issue:'var(--other)'};
  var KIND_NAME  = {stock:'สต๊อกจริง', log:'งานเข้า', move:'เบิก/สั่งผลิต', ref:'ชีตอ้างอิง', issue:'ชีตอ้างอิง'};

  var nf = function(n){ return Math.round(n).toLocaleString('th-TH'); };
  var MONTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  // แปลงวันที่ในชีตให้เทียบกันได้ (17/9/2026, 12/9, 2026-09-17)
  function dkey(d){
    if(!d) return '';
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if(m) return (+m[1] >= 2000) ? d : '';
    m = /^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/.exec(d);
    if(!m) return '';
    var y = m[3] ? +m[3] : THIS_YEAR;
    if(y < 100) y += (y + 2000 > THIS_YEAR + 1) ? 2500 : 2000;   // 69 = พ.ศ. 2569
    if(y > 2400) y -= 543;
    return y + '-' + pad2(m[2]) + '-' + pad2(m[1]);
  }
  function pad2(n){ return (+n < 10 ? '0' : '') + (+n); }
  function dayLabel(key){
    var p = key.split('-');
    return (+p[2]) + ' ' + MONTH[+p[1] - 1] + ' ' + p[0];
  }
  var PAGE = 150;
  var state = {kind:'today', q:'', model:null, limit:PAGE, showOther:false};

  var elRows = document.getElementById('rows');
  var elCount = document.getElementById('count');
  var elTitle = document.getElementById('title');
  var elQ = document.getElementById('q');
  var elSearchRow = document.getElementById('searchrow');
  document.getElementById('boot').remove();

  var TODAY = '', THIS_YEAR = new Date().getFullYear();
  (function(){
    var g = (DATA.meta || {}).generated || '';
    if(/^\d{4}-\d{2}-\d{2}/.test(g)){ TODAY = g.slice(0, 10); THIS_YEAR = +g.slice(0, 4); }
  })();

  // วันที่ข้อมูล
  (function(){
    var g = (DATA.meta || {}).generated;
    if(!g) return;
    var d = new Date(g);
    if(isNaN(d)) return;
    document.getElementById('asof').textContent =
      'ณ ' + d.toLocaleDateString('th-TH', {day:'numeric', month:'short'});
  })();

  // ค้นแบบไม่ให้เลขไปโผล่กลางรหัสอื่น: พิมพ์ 063 ต้องเจอ ก063 แต่ไม่เจอ 2063
  function hit(text, q){
    text = String(text).toLowerCase();
    var i = text.indexOf(q);
    while(i >= 0){
      var before = i === 0 ? '' : text.charAt(i - 1);
      if(!/[0-9]/.test(before)) return true;
      i = text.indexOf(q, i + 1);
    }
    return false;
  }
  function matches(it, q){
    if(!q) return true;
    return hit(it.model, q) || hit(it.color, q) || hit(it.sheet, q);
  }

  function pool(){
    var q = state.q.trim().toLowerCase();
    return items.filter(function(it){
      var want = state.kind === 'today' ? 'stock' : state.kind;
      return (want === 'all' || it.kind === want) && matches(it, q);
    });
  }

  // ---------- หน้ารายการรุ่น ----------
  function renderList(){
    document.body.dataset.view = 'list';
    elTitle.textContent = 'สต๊อกชั้น 4';
    var rows = pool();
    var map = new Map();
    rows.forEach(function(it){
      var m = map.get(it.model);
      if(!m){ m = {model:it.model, total:0, colors:0, kind:it.kind}; map.set(it.model, m); }
      m.total += it.total;
      m.colors += 1;
      if(it.kind === 'stock') m.kind = 'stock';
    });
    var list = [...map.values()].sort(function(a,b){ return b.total - a.total; });

    elCount.hidden = false;
    elCount.textContent = list.length
      ? nf(list.length) + ' รุ่น · รวม ' + nf(list.reduce(function(a,b){return a + b.total;}, 0)) + ' ชิ้น'
      : '';

    if(!list.length){
      elRows.innerHTML = '<div class="empty"><b>ไม่พบรุ่นที่ค้นหา</b>' +
        'ลองพิมพ์สั้นลง หรือกดปุ่ม “ทั้งหมด” ด้านบนเพื่อค้นทุกชีต</div>';
      return;
    }

    var shown = list.slice(0, state.limit);
    var html = '';
    shown.forEach(function(m){
      html += '<button class="row" data-model="' + esc(m.model) + '">' +
        '<span class="dot" style="background:' + (KIND_COLOR[m.kind] || 'var(--other)') + '"></span>' +
        '<span class="main"><span class="name">' + esc(m.model || '(ไม่มีชื่อรุ่น)') + '</span>' +
        '<span class="sub">' + nf(m.colors) + ' สี/ลาย</span></span>' +
        '<span class="qty"><b class="num">' + nf(m.total) + '</b><span>ชิ้น</span></span>' +
        chev() + '</button>';
    });
    if(list.length > shown.length){
      html += '<button class="row more" id="more"><span class="main">' +
        '<span class="name">แสดงเพิ่ม</span><span class="sub">เหลืออีก ' +
        nf(list.length - shown.length) + ' รุ่น</span></span></button>';
    }
    elRows.innerHTML = html;
  }

  // ---------- หน้ารายละเอียดรุ่น ----------
  function renderDetail(){
    document.body.dataset.view = 'detail';
    elTitle.textContent = state.model || '(ไม่มีชื่อรุ่น)';
    elCount.hidden = true;

    var all = items.filter(function(it){ return it.model === state.model; });
    var byKind = {stock:0, log:0, move:0, other:0};
    var lastDate = '';
    all.forEach(function(it){
      var k = (it.kind === 'ref' || it.kind === 'issue') ? 'other' : it.kind;
      byKind[k] = (byKind[k] || 0) + it.total;
      if(it.kind === 'stock' && it.date > lastDate) lastDate = it.date;
    });

    var view = state.kind === 'today' ? 'stock' : state.kind;
    var base = view === 'all' ? ['stock','log','move','ref','issue'] : [view];
    var kinds = state.showOther ? ['stock','log','move','ref','issue'] : base;
    var rows = all.filter(function(it){ return kinds.indexOf(it.kind) >= 0; })
                  .sort(function(a,b){ return b.total - a.total; });

    var leadName = KIND_NAME[base[0]] || 'ทั้งหมด';
    var leadTotal = view === 'all'
      ? all.reduce(function(a,b){ return a + b.total; }, 0)
      : (byKind[view === 'ref' || view === 'issue' ? 'other' : view] || 0);

    var html = '<div class="dhead"><div class="dtitle">' +
      '<h2><span class="kicker">รุ่น</span> ' + esc(state.model || '(ไม่มีชื่อรุ่น)') + '</h2>' +
      '<div class="lead">' + esc(leadName) + ' <b class="num">' + nf(leadTotal) + '</b> ชิ้น</div></div>' +
      '<div class="chips">';
    if(lastDate) html += '<span class="chip">เช็คล่าสุด <b>' + esc(fdate(lastDate)) + '</b></span>';
    [['log','งานเข้า (สะสม)'], ['move','เบิก / สั่งผลิต'], ['other','ชีตอ้างอิง']].forEach(function(k){
      if(!byKind[k[0]]) return;
      html += '<span class="chip"><span class="dot" style="background:' +
        (KIND_COLOR[k[0]] || 'var(--other)') + '"></span>' + k[1] +
        ' <b class="num">' + nf(byKind[k[0]]) + '</b></span>';
    });
    if(view !== 'all' && all.length > rows.length || state.showOther){
      html += '<button class="chip" id="toggleOther">' +
        (state.showOther ? 'ซ่อนชีตอื่น' : 'แสดงชีตอื่น') + '</button>';
    }
    html += '</div></div>';

    html += tableHTML(rows);
    elRows.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function tableHTML(rows, withModel){
    if(!rows.length){
      return '<div class="empty"><b>ไม่มีข้อมูลในหมวดนี้</b>กดปุ่ม “แสดงชีตอื่น” หรือกลับไปเลือกหมวดอื่นด้านบน</div>';
    }
    var cols = sizeOrder.filter(function(sz){
      return rows.some(function(it){ return it.sizes[sz] !== undefined; });
    });
    var max = 1, foot = {}, grand = 0;
    rows.forEach(function(it){
      cols.forEach(function(sz){
        var v = it.sizes[sz];
        if(v === undefined) return;
        if(v > max) max = v;
        foot[sz] = (foot[sz] || 0) + v;
      });
      grand += it.total;
    });

    var h = '<div class="tablewrap"><table><thead><tr>' +
      '<th class="who">' + (withModel ? 'รุ่น / สี' : 'ลาย / สี') + '</th>';
    cols.forEach(function(sz){ h += '<th>' + esc(sz) + '</th>'; });
    h += '<th class="sum">รวม</th></tr></thead><tbody>';

    rows.forEach(function(it){
      h += '<tr' + (withModel ? ' class="tap" data-model="' + esc(it.model) + '"' : '') + '><td class="who">' +
        (withModel ? '<span class="cmodel">' + esc(it.model || '(ไม่มีชื่อรุ่น)') + '</span>' : '') +
        '<span class="cname' + (withModel ? ' sub2' : '') + '">' + esc(it.color || '(ไม่ระบุสี)') + '</span>' +
        '<span class="csheet"><span class="dot" style="background:' +
        (KIND_COLOR[it.kind] || 'var(--other)') + '"></span>' + esc(it.sheet) +
        (it.date ? ' · ' + esc(fdate(it.date)) : '') + '</span></td>';
      cols.forEach(function(sz){
        var v = it.sizes[sz];
        if(v === undefined){ h += '<td class="n zero">·</td>'; return; }
        var a = 0.10 + 0.45 * Math.min(1, v / max);
        h += '<td class="n"><span style="background:rgba(var(--cellrgb),' + a.toFixed(2) + ')">' +
          nf(v) + '</span></td>';
      });
      h += '<td class="n sum">' + nf(it.total) + '</td></tr>';
    });

    h += '</tbody><tfoot><tr><td class="who">รวมทุกสี</td>';
    cols.forEach(function(sz){ h += '<td class="n">' + (foot[sz] ? nf(foot[sz]) : '·') + '</td>'; });
    h += '<td class="n">' + nf(grand) + '</td></tr></tfoot></table></div>';
    return h;
  }

  // วันที่: ISO -> วัน/เดือน/ปี, ปีต่ำกว่า 2000 คือปี พ.ศ. 2 หลักที่ Google อ่านเป็น 19xx
  function fdate(d){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    if(!m) return d;
    var y = +m[1];
    return (+m[3]) + '/' + (+m[2]) + '/' + (y >= 2000 ? y : String(y).slice(2));
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function chev(){
    return '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M9 18l6-6-6-6"/></svg>';
  }
  function render(){
    if(state.model) return renderDetail();
    if(state.kind === 'today') return renderToday();
    if(state.q.trim()) return renderSearch();
    renderList();
  }

  // ---------- แท็บเช็ควันนี้: เรียงตามวันที่เช็คล่าสุด ----------
  function renderToday(){
    document.body.dataset.view = 'list';
    elTitle.textContent = 'สต๊อกชั้น 4';
    var rows = pool().map(function(it){ return {it:it, k:dkey(it.date)}; })
      .filter(function(r){ return r.k && r.k <= TODAY && r.k >= '2015-01-01'; })
      .sort(function(a,b){ return a.k === b.k ? b.it.total - a.it.total : (a.k < b.k ? 1 : -1); });

    if(!rows.length){
      elCount.hidden = true;
      elRows.innerHTML = '<div class="empty"><b>ยังไม่มีแถวที่ลงวันที่เช็ค</b>' +
        'ลองดูแท็บสต๊อกจริงแทน</div>';
      return;
    }

    var newest = rows[0].k;
    var todayRows = rows.filter(function(r){ return r.k === TODAY; });
    elCount.hidden = false;
    elCount.textContent = todayRows.length
      ? 'เช็ควันนี้ ' + dayLabel(TODAY) + ' · ' +
        nf(new Set(todayRows.map(function(r){ return r.it.model; })).size) + ' รุ่น · รวม ' +
        nf(todayRows.reduce(function(a,b){ return a + b.it.total; }, 0)) + ' ชิ้น'
      : 'วันนี้ยังไม่มีการเช็ค · ล่าสุด ' + dayLabel(newest);

    var shown = rows.slice(0, state.limit), html = '', group = [], key = null;
    function flush(){
      if(!group.length) return;
      var sum = group.reduce(function(a,b){ return a + b.total; }, 0);
      html += '<div class="daygroup"><div class="dayhead"><b>' +
        (key === TODAY ? 'วันนี้ · ' : '') + dayLabel(key) + '</b>' +
        '<span class="pill">' + nf(group.length) + ' สี/ลาย · ' + nf(sum) + ' ชิ้น</span></div>' +
        tableHTML(group, true) + '</div>';
      group = [];
    }
    shown.forEach(function(r){
      if(r.k !== key){ flush(); key = r.k; }
      group.push(r.it);
    });
    flush();

    if(rows.length > shown.length){
      html += '<button class="row more" id="more"><span class="main">' +
        '<span class="name">แสดงวันก่อนหน้า</span><span class="sub">เหลืออีก ' +
        nf(rows.length - shown.length) + ' สี/ลาย</span></span></button>';
    }
    elRows.innerHTML = html;
  }

  // ---------- ค้นหาแล้วเห็นไซส์ทันที ----------
  function renderSearch(){
    document.body.dataset.view = 'list';
    elTitle.textContent = 'สต๊อกชั้น 4';
    var rows = pool().sort(function(a,b){ return b.total - a.total; });
    var models = new Set(rows.map(function(it){ return it.model; }));

    elCount.hidden = false;
    elCount.textContent = rows.length
      ? nf(models.size) + ' รุ่น · ' + nf(rows.length) + ' สี/ลาย · รวม ' +
        nf(rows.reduce(function(a,b){ return a + b.total; }, 0)) + ' ชิ้น'
      : '';

    if(!rows.length){
      elRows.innerHTML = '<div class="empty"><b>ไม่พบรุ่นที่ค้นหา</b>' +
        'ลองพิมพ์สั้นลง หรือกดปุ่ม “ทั้งหมด” ด้านบนเพื่อค้นทุกชีต</div>';
      return;
    }
    var shown = rows.slice(0, state.limit);
    var html = tableHTML(shown, true);
    if(rows.length > shown.length){
      html += '<button class="row more" id="more"><span class="main">' +
        '<span class="name">แสดงเพิ่ม</span><span class="sub">เหลืออีก ' +
        nf(rows.length - shown.length) + ' สี/ลาย</span></span></button>';
    }
    elRows.innerHTML = html;
  }

  // ---------- การกด ----------
  elRows.addEventListener('click', function(e){
    if(e.target.closest('#more')){
      state.limit += PAGE;
      render();
      return;
    }
    if(e.target.closest('#toggleOther')){
      state.showOther = !state.showOther;
      renderDetail();
      return;
    }
    var tr = e.target.closest('tr.tap');
    var row = tr || e.target.closest('.row');
    if(!row) return;
    state.model = row.dataset.model;
    state.showOther = false;
    history.pushState({model:state.model}, '');
    render();
  });
  function goBack(){
    if(state.model){ state.model = null; state.showOther = false; render(); }
  }
  document.getElementById('back').addEventListener('click', function(){
    if(history.state && history.state.model) history.back(); else goBack();
  });
  window.addEventListener('popstate', goBack);

  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    state.kind = b.dataset.kind;
    state.model = null;
    state.limit = PAGE;
    window.scrollTo(0, 0);
    [...this.querySelectorAll('button')].forEach(function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    render();
  });

  var timer;
  elQ.addEventListener('input', function(){
    elSearchRow.classList.toggle('filled', !!elQ.value);
    clearTimeout(timer);
    timer = setTimeout(function(){
      state.q = elQ.value;
      state.model = null;
      state.limit = PAGE;
      render();
      window.scrollTo(0, 0);
    }, 120);
  });
  document.getElementById('clear').addEventListener('click', function(){
    elQ.value = ''; state.q = ''; state.model = null; state.limit = PAGE;
    elSearchRow.classList.remove('filled');
    render();
    elQ.focus();
  });

  render();
}
</script>

<script>
// ====== ใส่ URL ของ Apps Script (Web app) ตรงนี้ ======
var API_URL = 'วาง_URL_ที่ลงท้ายด้วย_exec_ตรงนี้';

// ดึงข้อมูลจากชีตผ่าน Apps Script ก่อน ถ้าไม่ได้ค่อยใช้ไฟล์ data.js ที่มีอยู่ใน repo
(function(){
  function useFile(){
    var paths = ['assets/data.js', 'data.js'], i = 0;
    (function next(){
      if(i >= paths.length) return fail();
      var s = document.createElement('script');
      s.src = paths[i++] + '?v=' + Date.now();
      s.onload = function(){ window.STOCK_DATA ? startApp() : next(); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  }
  function fail(){
    document.querySelector('.wrap').innerHTML =
      '<div class="empty"><b>ยังไม่มีข้อมูล</b>' +
      'ดึงจากชีตไม่สำเร็จ และไม่พบไฟล์ data.js ในเว็บนี้ — ตรวจว่า API_URL ในไฟล์ index.html ถูกต้อง ' +
      'และ Apps Script ตั้ง Who has access เป็น Anyone แล้ว</div>';
  }
  if(!/^https:\/\/script\.google\.com\/.*exec/.test(API_URL)) return useFile();
  fetch(API_URL + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.items) throw 0;
      window.STOCK_DATA = d;
      startApp();
    })
    .catch(useFile);
})();
</script>
